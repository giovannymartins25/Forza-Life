<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#0B0F19"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="#1E293B" stroke-width="8"/>
  <!-- Racing tachometer arc -->
  <path d="M120 360 A 180 180 0 1 1 392 360" stroke="#1E293B" stroke-width="24" stroke-linecap="round"/>
  <path d="M120 360 A 180 180 0 0 1 340 135" stroke="url(#accentGradient)" stroke-width="24" stroke-linecap="round"/>
  <!-- Central stylized H / Speed dial -->
  <polygon points="190,170 230,170 200,342 160,342" fill="#F59E0B"/>
  <polygon points="282,170 322,170 292,342 252,342" fill="#38BDF8"/>
  <polygon points="200,240 310,240 300,270 190,270" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="accentGradient" x1="120" y1="360" x2="340" y2="135" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="0.5" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
</svg>